name: lock-threads

on:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: lock

jobs:
  action:
    runs-on: ubuntu-22.04
    steps:
    - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c
      with:
        issue-lock-reason: resolved
        issue-inactive-days: 7
        pr-lock-reason: resolved
        pr-inactive-days: 7
        log-output: true
